name: Automated Code Review

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ] # Kích hoạt khi có PR hướng vào master

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Quan trọng: Cấp quyền để Bot có thể viết comment

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Checkstyle
        # Sử dụng Action tự động đăng bình luận trực tiếp vào code vi phạm
        uses: dbelyaev/action-checkstyle@master
        with:
          github_token: ${{ secrets.github_token }}
          level: error # Nếu có lỗi, bước này sẽ báo đỏ (Fail)